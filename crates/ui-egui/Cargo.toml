[package]
name = "oracle-edit-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
craft-print = { workspace = true }
craft-ui = { workspace = true }
oracle-edit-geom = { workspace = true }
oracle-edit-color = { workspace = true }
oracle-edit-cms = { workspace = true }
oracle-edit-raster = { workspace = true }
oracle-edit-doc = { workspace = true }
oracle-edit-compose = { workspace = true }
oracle-edit-gpu = { workspace = true }
oracle-edit-engine = { workspace = true }
oracle-edit-io = { workspace = true }
oracle-edit-plugins = { workspace = true }
oracle-edit-algo = { workspace = true }
oracle-edit-text = { workspace = true }
oracle-edit-vector = { workspace = true }
# Only MAX_BRUSH_SIZE: `ui.set brushSize` validates against the Brush Settings range up front.
oracle-edit-paint = { workspace = true }
# Reading files to open them (bounded reads, a clear error for files larger than memory).
oracle-edit-format = { workspace = true }
# Decoding the brand mark's PNG (`brand.rs`); already linked through oracle-edit-io.
oracle-edit-codecs = { workspace = true }
egui = { workspace = true }
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
eframe = { workspace = true, features = ["wgpu", "accesskit"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# Display order of right-to-left labels (`bidi_text.rs`); already linked through usvg.
unicode-bidi = "0.3"
base64 = "0.22"
# Inflating the translation catalogs, stored deflated (build.rs); already linked through oracle-edit-io.
flate2 = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The Oracle Library window: the user's asset folder, searchable, dragged onto the document.
oracle-library-ui = { path = "../../../oracle-library/ui" }
# Edit Contents of another Oracle app's document opens it in that app (edit_original.rs).
oracle-suite-link = { path = "../../../oracle-library/link" }
oracle-style = { path = "../../../oracle-library/style" }
rayon = { workspace = true }
# Safe native UI-language APIs (Windows/macOS); no subprocess or web dependency.
sys-locale = "=0.3.2"

# Installed RAM for the GPU memory budget (`gpu_canvas::physical_memory`): the safe binding the
# desktop app already uses, pinned to the same version.
[target.'cfg(target_os = "windows")'.dependencies]
winsafe = { version = "=0.0.29", default-features = false, features = ["kernel", "dxgi"] }

[dev-dependencies]
# egui's own default fonts in tests: the oracle for egui_fonts.rs, and contexts made with
# `Context::default()` (no install_fonts) can lay out text.
egui = { workspace = true, features = ["default_fonts"] }
# Synthetic raw files for the open-time Camera Raw dialog tests.
oracle-edit-raw = { workspace = true, features = ["testgen"] }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot", "eframe"] }
# Benchmark helpers for the `--json` benches `cargo xtask perf` runs (in-process RSS, percentiles).
oracle-edit-testkit = { workspace = true }
# examples/perf_scenarios.rs (a 500-brush .abr for the #210 import row) and large_file_bench.rs
# (the generated 2 GB PSD and 4.4 GB PSB of P20, `fixtures`).
oracle-edit-psd = { workspace = true, features = ["testgen"] }

[build-dependencies]
# Deflates the translation catalogs and egui's default fonts (build.rs); already linked at run time to inflate them.
flate2 = { workspace = true }
# egui's default fonts, deflated by build.rs for egui_fonts.rs (the same version egui uses).
epaint_default_fonts = "0.36"
serde_json = { workspace = true }
toml = "1"
