[package]
name = "oracle-edit-cli"
description = "Headless Oracle Edit: convert, inspect, run commands, batch, MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
# Open HEIC/HEIF photos (the optional oracle-edit-heif crate). Not default so distributors choose
# it; official builds (CI, packaging/, release) build with `--features heif`.
heif = ["oracle-edit-codecs/heif"]

[lints]
workspace = true

[lib]
name = "oracle_edit_cli"
path = "src/lib.rs"

[[bin]]
name = "oracle-edit-cli"
path = "src/main.rs"

[dependencies]
oracle-edit-automation = { path = "../../crates/automation" }
oracle-edit-engine = { workspace = true }
oracle-edit-io = { workspace = true }
oracle-edit-format = { path = "../../crates/format" }
oracle-edit-codecs = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
# Icon + VERSIONINFO for oracle-edit-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

